<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal MCP Gateway · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Universal MCP Gateway</p>
    <h1>One MCP endpoint in front of every backend</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="umg-architecture-title umg-architecture-desc">
        <title id="umg-architecture-title">Universal MCP Gateway architecture</title>
        <desc id="umg-architecture-desc">MCP clients and an operator browser reach a focal gateway on port 8787; the gateway routes tool calls to MCP backends, managed integrations, and a SQLite store, while the Next.js dashboard administers it over loopback.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows first (behind boxes) -->
        <!-- MCP clients -> gateway (elbow: down, right, down) -->
        <path d="M 184,144 V 192 Q 184,200 192,200 H 352 Q 360,200 360,208 V 216"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Browser -> dashboard (vertical) -->
        <line x1="776" y1="144" x2="776" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Dashboard -> gateway (horizontal, leftward) -->
        <line x1="656" y1="272" x2="576" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- Gateway -> backends (elbow: down, left, down) -->
        <path d="M 352,336 V 400 Q 352,408 344,408 H 192 Q 184,408 184,416 V 424"
              fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Gateway -> integrations (vertical) -->
        <line x1="464" y1="336" x2="464" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Gateway -> store (elbow: down, right, down) -->
        <path d="M 520,336 V 400 Q 520,408 528,408 H 768 Q 776,408 776,416 V 424"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (opaque masks, clear of their strokes) -->
        <rect x="236" y="182" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="272" y="191" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP · BEARER</text>

        <rect x="786" y="176" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="808" y="185" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="584" y="252" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="618" y="261" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST · SESSION</text>

        <rect x="246" y="388" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="268" y="397" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>

        <rect x="474" y="376" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="494" y="385" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>

        <rect x="618" y="388" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="648" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQLITE</text>

        <!-- Node: MCP clients (external) -->
        <rect x="64" y="80" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="80" width="240" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="72" y="88" width="50" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="97" y="97" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENTS</text>
        <text x="184" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP clients</text>
        <text x="184" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude Code · Codex · OpenCode</text>

        <!-- Node: Operator browser (external) -->
        <rect x="656" y="80" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="80" width="240" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="664" y="88" width="56" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="692" y="97" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPERATOR</text>
        <text x="776" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>
        <text x="776" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localhost:3000</text>

        <!-- Node: Gateway (focal coral) -->
        <rect x="288" y="216" width="288" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="216" width="288" height="120" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="296" y="224" width="50" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="321" y="233" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATEWAY</text>
        <text x="432" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Universal MCP Gateway</text>
        <text x="432" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:8787 · auth · policy · routing</text>

        <!-- Node: Dashboard (backend) -->
        <rect x="656" y="232" width="240" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="232" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="664" y="240" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="694" y="249" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DASHBOARD</text>
        <text x="776" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator dashboard</text>
        <text x="776" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Next.js · server-side proxy</text>

        <!-- Node: MCP backends (backend) -->
        <rect x="64" y="424" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="424" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="432" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="100" y="441" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BACKENDS</text>
        <text x="184" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MCP backends</text>
        <text x="184" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stdio · streamable HTTP</text>

        <!-- Node: Managed integrations (cloud) -->
        <rect x="360" y="424" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="424" width="240" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="368" y="432" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="398" y="441" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROVIDERS</text>
        <text x="480" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Managed integrations</text>
        <text x="480" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GitHub · Notion · Slack</text>

        <!-- Node: SQLite store (store) -->
        <rect x="656" y="424" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="656" y="424" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="664" y="432" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="684" y="441" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="776" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite</text>
        <text x="776" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agents · policies · audit</text>

        <!-- Legend strip -->
        <line x1="64" y1="540" x2="896" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="64" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="64" y="568" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="84" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / gateway</text>

        <rect x="210" y="568" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="230" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

        <rect x="320" y="568" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="340" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <rect x="420" y="568" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="440" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External</text>

        <line x1="530" y1="573" x2="558" y2="573" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="566" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

        <line x1="680" y1="573" x2="708" y2="573" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="716" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary route</text>

        <line x1="816" y1="573" x2="844" y2="573" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="852" y="576" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Persistence</text>
      </svg>
    </div>
  </div>
</body>
</html>
